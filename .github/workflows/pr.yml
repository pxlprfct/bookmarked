name: pr

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm tsc
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm exports
      - run: pnpm deadcode

  smoke:
    name: consume on node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      # build tooling (tsdown) needs a modern node; consumers only need `engines`
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: smoke test the built package (ESM and CJS)
        run: |
          node --input-type=module -e "import { bookmarked } from './dist/index.mjs'; if (!bookmarked().includes('NETSCAPE')) process.exit(1)"
          node -e "const { bookmarked } = require('./dist/index.cjs'); if (!bookmarked().includes('NETSCAPE')) process.exit(1)"
