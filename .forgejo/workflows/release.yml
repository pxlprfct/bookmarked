name: release

# Push a version tag (e.g. v4.0.0) to stage a release on npm.
# A maintainer then approves it with 2FA: `npm stage approve <stage-id>`
# or on npmjs.com. See RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: tag must match package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version v${version}" >&2
            exit 1
          fi

      - name: version must not already be on npm
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already published" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

      - name: stage on npm (needs approval)
        run: npm stage publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: list staged versions
        run: npm stage list
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
